plugins {
    id 'com.android.application'
}

android {
    namespace 'tr.edu.balikesir.anketrapor'
    compileSdk 35

    defaultConfig {
        applicationId 'tr.edu.balikesir.yerelajan'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '0.4.0'
    }

    buildTypes {
        debug {
            debuggable false
            jniDebuggable false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
