plugins {
    id 'com.android.application'
}

android {
    namespace 'tr.edu.balikesir.anketrapor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.basmayan.game'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '3.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
