[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oran-radar-cloud"
version = "4.0.0"
description = "Auditable spot market research and resumable historical data bank"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "pyarrow>=18,<27"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
r2 = ["boto3>=1.35,<2"]
research = ["numpy>=2,<3", "scikit-learn>=1.5,<2"]
excel = ["openpyxl>=3.1,<4"]

[project.scripts]
oran-cloud = "oran_cloud.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
oran_cloud = ["schema.sql"]
