AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Independent Oran Radar Lab serverless research backend
Parameters:
  ApiToken:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Private API token; set in mobile settings after deployment
  Pairs:
    Type: String
    Default: BTCTRY,ETHTRY,SOLTRY
    AllowedPattern: '[A-Z0-9]{2,20}TRY(,[A-Z0-9]{2,20}TRY)*'
  LookbackDays:
    Type: Number
    Default: 730
    MinValue: 30
    MaxValue: 1200
  MinimumDetectableLift:
    Type: Number
    Default: 0.10
    MinValue: 0.01
    MaxValue: 0.50
    Description: Predeclared probability difference to detect; not the observed effect
  StopMinimumGainBps:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 500
    Description: Predeclared paired net-return improvement target for stop research
  StopSlippageBps:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 500
    Description: Assumed exit slippage in stop shadow simulations; not measured fills
Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: ../backend_next/
    MemorySize: 1024
    Timeout: 30
    Environment:
      Variables:
        STATE_TABLE: !Ref StateTable
        PAPER_TABLE: !Ref PaperTable
        DATA_BUCKET: !Ref DataBucket
        WORK_QUEUE: !Ref WorkQueue
        DEAD_QUEUE: !Ref DeadQueue
        RADAR_PAIRS: !Ref Pairs
        LOOKBACK_DAYS: !Ref LookbackDays
        MIN_DETECTABLE_LIFT: !Ref MinimumDetectableLift
        STOP_MIN_GAIN_BPS: !Ref StopMinimumGainBps
        STOP_SLIPPAGE_BPS: !Ref StopSlippageBps
        RADAR_API_TOKEN: !Ref ApiToken
        OPENBLAS_NUM_THREADS: '1'
        OMP_NUM_THREADS: '1'
Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
  PaperTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      SSESpecification: {SSEEnabled: true}
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: {Status: Enabled}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt DataBucket.Arn, !Sub '${DataBucket.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': false}}
  DeadQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  WorkQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 5400
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedrivePolicy: {deadLetterTargetArn: !GetAtt DeadQueue.Arn, maxReceiveCount: 4}
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 5
  Scheduler:
    Type: AWS::Serverless::Function
    Properties:
      Handler: radar.handlers.scheduled
      Timeout: 120
      ReservedConcurrentExecutions: 1
      Policies:
        - SQSSendMessagePolicy: {QueueName: !GetAtt WorkQueue.QueueName}
        - SQSPollerPolicy: {QueueName: !GetAtt DeadQueue.QueueName}
        - DynamoDBCrudPolicy: {TableName: !Ref StateTable}
      Events:
        Tick:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: true
            RetryPolicy: {MaximumRetryAttempts: 2, MaximumEventAgeInSeconds: 300}
  Worker:
    Type: AWS::Serverless::Function
    Properties:
      Handler: radar.handlers.worker
      Timeout: 900
      MemorySize: 2048
      ReservedConcurrentExecutions: 3
      Policies:
        - SQSPollerPolicy: {QueueName: !GetAtt WorkQueue.QueueName}
        - DynamoDBCrudPolicy: {TableName: !Ref StateTable}
        - DynamoDBCrudPolicy: {TableName: !Ref PaperTable}
        - S3CrudPolicy: {BucketName: !Ref DataBucket}
      Events:
        Jobs:
          Type: SQS
          Properties:
            Queue: !GetAtt WorkQueue.Arn
            BatchSize: 1
            FunctionResponseTypes: [ReportBatchItemFailures]
  Api:
    Type: AWS::Serverless::Function
    Properties:
      Handler: radar.handlers.http
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref StateTable}
        - DynamoDBCrudPolicy: {TableName: !Ref PaperTable}
        - S3ReadPolicy: {BucketName: !Ref DataBucket}
        - SQSSendMessagePolicy: {QueueName: !GetAtt WorkQueue.QueueName}
      Events:
        Proxy:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Path: '/{proxy+}', Method: ANY}
  WorkerErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Worker runtime errors; inspect logs and reconcile
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref Worker}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  SchedulerStale:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No dispatcher invocation for 15 minutes
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions: [{Name: FunctionName, Value: !Ref Scheduler}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
  BacklogAge:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Work queue has fallen behind
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{Name: QueueName, Value: !GetAtt WorkQueue.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
Outputs:
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  WorkQueueUrl:
    Value: !Ref WorkQueue
  DataBucketName:
    Value: !Ref DataBucket
