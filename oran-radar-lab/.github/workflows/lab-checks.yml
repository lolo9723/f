name: Independent Lab checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.txt aws-sam-cli
      - run: PYTHONPATH=backend_next OPENBLAS_NUM_THREADS=1 pytest tests -q
      - run: ruff check backend_next tests
      - run: sam validate --lint --template-file infra/template.yaml --region eu-central-1
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: mobile}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: mobile/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: node scripts/test_paper.cjs
      - run: node scripts/test_backend_control.cjs
      - run: node scripts/test_phone_bridge.cjs
      - run: node scripts/test_trade_plan.cjs
      - run: node scripts/test_score_refresh.cjs
      - run: node scripts/test_live_prices.cjs
