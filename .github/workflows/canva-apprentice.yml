name: Canva Apprentice Android
on:
  push:
    branches: [canva-apprentice-agent]
    paths-ignore:
      - 'canva_apprentice/build_artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canva_apprentice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run safety unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: canva-apprentice-debug-apk
          path: canva_apprentice/app/build/outputs/apk/debug/app-debug.apk
      - name: Persist APK for chat handoff
        shell: bash
        run: |
          mkdir -p build_artifacts
          base64 -w 4000 app/build/outputs/apk/debug/app-debug.apk > build_artifacts/app-debug.apk.b64
          sha256sum app/build/outputs/apk/debug/app-debug.apk > build_artifacts/app-debug.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_artifacts/app-debug.apk.b64 build_artifacts/app-debug.apk.sha256
          git commit -m "CI: persist Canva apprentice APK [skip ci]" || exit 0
          git push
