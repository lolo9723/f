name: Video Factory Android

on:
  push:
    branches: [ "video-fabrikasi-android" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Lint
        run: gradle lintDebug --stacktrace
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: APK structural check
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "Video-Fabrikasi-v1.apk"
          ls -lh "Video-Fabrikasi-v1.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Fabrikasi-APK
          path: Video-Fabrikasi-v1.apk
          if-no-files-found: error

  emulator-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle connectedDebugAndroidTest --stacktrace
