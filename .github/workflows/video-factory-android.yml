name: Video Factory Android

on:
  push:
    branches: [ "video-fabrikasi-android" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-factory-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace
      - name: Preserve unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-Test-Reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
      - name: Live E2E tooling dry contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/kaggle_live_e2e.py
          rm -rf /tmp/vf-e2e-dry
          mkdir -p /tmp/vf-e2e-dry/classes
          javac -encoding UTF-8 -d /tmp/vf-e2e-dry/classes \
            app/src/main/java/com/videofabrikasi/app/VideoFactoryScript.java \
            app/src/main/java/com/videofabrikasi/app/VideoFactoryScriptV2.java \
            app/src/main/java/com/videofabrikasi/app/VideoFactoryScriptV3.java \
            app/src/main/java/com/videofabrikasi/app/VideoFactoryScriptV4.java \
            tools/com/videofabrikasi/app/GenerateE2EScript.java
          java -cp /tmp/vf-e2e-dry/classes com.videofabrikasi.app.GenerateE2EScript vf-ci-dry-run \
            > /tmp/vf-e2e-dry/kernel.py
          python3 -m py_compile /tmp/vf-e2e-dry/kernel.py
          grep -q "story-v3" /tmp/vf-e2e-dry/kernel.py
          grep -q "Helsinki-NLP/opus-mt-tr-en" /tmp/vf-e2e-dry/kernel.py
          grep -q "CONTINUITY_STRENGTH = 0.65" /tmp/vf-e2e-dry/kernel.py
          echo "Live E2E tooling dry contract PASS"
      - name: Lint
        run: gradle lintDebug --stacktrace
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: APK structural check
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "Video-Fabrikasi-v1.apk"
          ls -lh "Video-Fabrikasi-v1.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Fabrikasi-APK
          path: Video-Fabrikasi-v1.apk
          if-no-files-found: error

  emulator-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-unit-test
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented UI tests API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/run_android_instrumentation.sh
      - name: Preserve emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-${{ matrix.api-level }}-Instrumentation-Reports
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            app/build/infra-flake-attempt1/**
          if-no-files-found: warn
