name: Resume Context Continuity Patch V2

on:
  push:
    branches: [canva-apprentice-agent]
    paths:
      - '.github/workflows/resume-context-continuity-patch-v2.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canva-apprentice-agent
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install API 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Patch resume context continuity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('canva_apprentice/app/src/main/java/com/emrah/canvaapprentice/AgentAccessibilityService.java')
          s = p.read_text()
          replacements = [
          ('''        }else if(restored.mode==TaskState.Mode.RUNNING){
              final long generation=resumeGeneration.begin();
              new Handler(Looper.getMainLooper()).postDelayed(() -> resumeOnCanva(generation,0),500);
          }
          ''','''        }else if(restored.mode==TaskState.Mode.RUNNING){
              final long generation=resumeGeneration.begin();
              final String resumeSessionId=repo.currentTeacherSessionId();
              final String resumeDesignAnchor=restored.designAnchor;
              new Handler(Looper.getMainLooper()).postDelayed(
                      () -> resumeOnCanva(generation,resumeSessionId,resumeDesignAnchor,0),500);
          }
          '''),
          ('''    private void showHumanOverlay(String reason){
              overlay.show(reason,()->{
                  final long generation=resumeGeneration.begin();
                  TeacherExecutionLease.invalidateGlobal();
                  visualEvidence.clear();
                  repo.resume();
                  cycleBusy.set(false);
                  consecutiveNoVisualChange=0;
                  consecutiveExecutionFailures=0;
                  resumeOnCanva(generation,0);
              });
          }
          ''','''    private void showHumanOverlay(String reason){
              overlay.show(reason,()->{
                  TeacherExecutionLease.invalidateGlobal();
                  visualEvidence.clear();
                  repo.resume();
                  TaskState resumed=repo.load();
                  if(resumed.mode!=TaskState.Mode.RUNNING){
                      resumeGeneration.invalidate();
                      return;
                  }
                  final long generation=resumeGeneration.begin();
                  final String resumeSessionId=repo.currentTeacherSessionId();
                  final String resumeDesignAnchor=resumed.designAnchor;
                  cycleBusy.set(false);
                  consecutiveNoVisualChange=0;
                  consecutiveExecutionFailures=0;
                  resumeOnCanva(generation,resumeSessionId,resumeDesignAnchor,0);
              });
          }
          '''),
          ('''    private void resumeOnCanva(long generation, int attempt){
              if(!resumeGeneration.isCurrent(generation)) return;
              TaskState state=repo.load();
              if(state.mode!=TaskState.Mode.RUNNING){
                  resumeGeneration.invalidate();
                  return;
              }

              AccessibilityNodeInfo root=getRootInActiveWindow();
          ''','''    private boolean isResumeContextCurrent(long generation, String expectedSessionId, String expectedDesignAnchor){
              if(!resumeGeneration.isCurrent(generation) || repo==null) return false;
              TaskState current=repo.load();
              return ResumeContextPolicy.isCurrent(
                      current.mode,current.designAnchor,repo.currentTeacherSessionId(),
                      expectedDesignAnchor,expectedSessionId);
          }

          private void resumeOnCanva(long generation, String expectedSessionId, String expectedDesignAnchor, int attempt){
              if(!isResumeContextCurrent(generation,expectedSessionId,expectedDesignAnchor)) return;
              AccessibilityNodeInfo root=getRootInActiveWindow();
          '''),
          ('''        if(AgentConstants.CANVA_PACKAGE.equals(pkg)){
              resumeGeneration.consumeIfCurrent(generation,()->{
                  if(repo.load().mode!=TaskState.Mode.RUNNING) return;
                  cycleBusy.set(false);
                  runCanvaCycle("Kullanıcı müdahalesi tamamlandı. Önce mevcut durumu yeniden doğrula ve kaldığın görevden devam et.");
              });
              return;
          }
          ''','''        if(AgentConstants.CANVA_PACKAGE.equals(pkg)){
              if(!isResumeContextCurrent(generation,expectedSessionId,expectedDesignAnchor)) return;
              resumeGeneration.consumeIfCurrent(generation,()->{
                  TaskState current=repo.load();
                  if(!ResumeContextPolicy.isCurrent(current.mode,current.designAnchor,repo.currentTeacherSessionId(),
                          expectedDesignAnchor,expectedSessionId)) return;
                  cycleBusy.set(false);
                  runCanvaCycle("Kullanıcı müdahalesi tamamlandı. Önce mevcut durumu yeniden doğrula ve kaldığın görevden devam et.");
              });
              return;
          }
          '''),
          ('''        if(attempt>=12){
              resumeGeneration.consumeIfCurrent(generation,()->{
                  if(repo.load().mode!=TaskState.Mode.RUNNING) return;
                  pauseForHuman("Canva'ya güvenli biçimde dönülemedi. Canva'yı açıp DEVAM ET'e tekrar bas.");
              });
              return;
          }
          ''','''        if(attempt>=12){
              if(!isResumeContextCurrent(generation,expectedSessionId,expectedDesignAnchor)) return;
              resumeGeneration.consumeIfCurrent(generation,()->{
                  TaskState current=repo.load();
                  if(!ResumeContextPolicy.isCurrent(current.mode,current.designAnchor,repo.currentTeacherSessionId(),
                          expectedDesignAnchor,expectedSessionId)) return;
                  pauseForHuman("Canva'ya güvenli biçimde dönülemedi. Canva'yı açıp DEVAM ET'e tekrar bas.");
              });
              return;
          }
          '''),
          ('''        if(!resumeGeneration.isCurrent(generation)) return;
              new Handler(Looper.getMainLooper()).postDelayed(() -> resumeOnCanva(generation,attempt+1),300);
          ''','''        if(!isResumeContextCurrent(generation,expectedSessionId,expectedDesignAnchor)) return;
              new Handler(Looper.getMainLooper()).postDelayed(
                      () -> resumeOnCanva(generation,expectedSessionId,expectedDesignAnchor,attempt+1),300);
          ''')]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('expected source snippet not found')
              s=s.replace(old,new,1)
          p.write_text(s)
          Path('canva_apprentice/app/src/main/java/com/emrah/canvaapprentice/ResumeContextPolicy.java').write_text('''package com.emrah.canvaapprentice;\n\nfinal class ResumeContextPolicy {\n    private ResumeContextPolicy() {}\n    static boolean isCurrent(TaskState.Mode mode, String currentAnchor, String currentSessionId, String expectedAnchor, String expectedSessionId) {\n        if (mode != TaskState.Mode.RUNNING) return false;\n        String cs=currentSessionId==null?"":currentSessionId.trim();\n        String es=expectedSessionId==null?"":expectedSessionId.trim();\n        if(es.isEmpty() || !es.equals(cs)) return false;\n        String ca=currentAnchor==null?"":currentAnchor.trim();\n        String ea=expectedAnchor==null?"":expectedAnchor.trim();\n        return ea.equals(ca);\n    }\n}\n''')
          Path('canva_apprentice/app/src/test/java/com/emrah/canvaapprentice/ResumeContextPolicyTest.java').write_text('''package com.emrah.canvaapprentice;\n\nimport org.junit.Test;\nimport static org.junit.Assert.*;\n\npublic class ResumeContextPolicyTest {\n @Test public void sameRunningSessionAndAnchorPass(){ assertTrue(ResumeContextPolicy.isCurrent(TaskState.Mode.RUNNING,"A","s2","A","s2")); }\n @Test public void rotatedSessionFails(){ assertFalse(ResumeContextPolicy.isCurrent(TaskState.Mode.RUNNING,"A","s3","A","s2")); }\n @Test public void rotatedAnchorFails(){ assertFalse(ResumeContextPolicy.isCurrent(TaskState.Mode.RUNNING,"B","s2","A","s2")); }\n @Test public void nonRunningFails(){ assertFalse(ResumeContextPolicy.isCurrent(TaskState.Mode.HUMAN_TAKEOVER,"A","s2","A","s2")); }\n @Test public void emptyExpectedSessionFails(){ assertFalse(ResumeContextPolicy.isCurrent(TaskState.Mode.RUNNING,"A","s2","A","")); }\n}\n''')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/resume-context-continuity-patch-v2.yml
      - name: Commit patched source locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canva_apprentice/app/src/main/java/com/emrah/canvaapprentice/AgentAccessibilityService.java canva_apprentice/app/src/main/java/com/emrah/canvaapprentice/ResumeContextPolicy.java canva_apprentice/app/src/test/java/com/emrah/canvaapprentice/ResumeContextPolicyTest.java .github/workflows/resume-context-continuity-patch-v2.yml
          git commit -m 'Harden resume session and design continuity'
      - name: Validate exact committed tree
        working-directory: canva_apprentice
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Push validated commit
        run: git push origin HEAD:canva-apprentice-agent
