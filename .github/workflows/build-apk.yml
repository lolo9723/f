name: APK Derle

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gömülü Qwen modelini indir ve doğrula
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q 'huggingface_hub[hf_xet]>=0.34.0'
          mkdir -p app/src/main/assets/models
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import hashlib, shutil

          EXPECTED_SIZE = 347_251_840
          EXPECTED_SHA = '2df6821ec12702dafd33915e7a1a1adc7c4b053f3672fd9555dfaf3a114c4139'
          filename = 'qwen3_0.6b_nothink_q4_block32_ekv1280.litertlm'
          src = Path(hf_hub_download(
              repo_id='litert-community/Qwen3-0.6B-int4',
              filename=filename,
          ))
          dst = Path('app/src/main/assets/models') / filename
          shutil.copyfile(src, dst)
          size = dst.stat().st_size
          h = hashlib.sha256()
          with dst.open('rb') as f:
              for chunk in iter(lambda: f.read(8*1024*1024), b''):
                  h.update(chunk)
          digest = h.hexdigest()
          print('BUNDLED_MODEL_SIZE='+str(size))
          print('BUNDLED_MODEL_SHA256='+digest)
          if size != EXPECTED_SIZE:
              raise SystemExit(f'Model boyutu hatalı: {size} != {EXPECTED_SIZE}')
          if digest != EXPECTED_SHA:
              raise SystemExit(f'Model SHA256 hatalı: {digest}')
          Path('app/src/main/assets/models/model.sha256').write_text(EXPECTED_SHA+'\n')
          PY

      - name: APK oluştur
        run: gradle assembleDebug --stacktrace

      - name: Kaynak ve APK 100 kontrol
        run: python scripts/verify_100.py app/build/outputs/apk/debug/app-debug.apk

      - name: Dosyayı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk "Yerel Ajan 1.0.4.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Yerel-Ajan-1.0.4-100-Kontrol
          path: Yerel Ajan 1.0.4.apk
          if-no-files-found: error
          compression-level: 0
