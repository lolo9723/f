name: Resume Context Continuity Apply
on:
  push:
    branches: [canva-apprentice-agent]
    paths:
      - '.github/workflows/resume-context-continuity-apply.yml'
permissions:
  contents: write
jobs:
  apply-validate-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canva-apprentice-agent
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reuse reviewed V3 source patch
        run: |
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/resume-context-continuity-patch-v3.yml | sed '1d;$d;s/^          //' > /tmp/resume_patch.py
          python /tmp/resume_patch.py
      - name: Remove one-shot patch workflows
        run: rm .github/workflows/resume-context-continuity-patch-v3.yml .github/workflows/resume-context-continuity-apply.yml
      - name: Commit candidate locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canva_apprentice/app/src/main/java/com/emrah/canvaapprentice/AgentAccessibilityService.java canva_apprentice/app/src/main/java/com/emrah/canvaapprentice/ResumeContextPolicy.java canva_apprentice/app/src/test/java/com/emrah/canvaapprentice/ResumeContextPolicyTest.java .github/workflows/resume-context-continuity-patch-v3.yml .github/workflows/resume-context-continuity-apply.yml
          git commit -m 'Harden resume session and design continuity'
      - name: Validate exact candidate
        working-directory: canva_apprentice
        run: |
          gradle :app:testDebugUnitTest --stacktrace
          gradle :app:assembleDebug --stacktrace
      - name: Push validated candidate
        run: git push origin HEAD:canva-apprentice-agent
