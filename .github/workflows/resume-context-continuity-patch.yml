name: Resume Context Continuity Patch

on:
  push:
    branches: [canva-apprentice-agent]
    paths:
      - '.github/workflows/resume-context-continuity-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canva-apprentice-agent
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install API 36
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Patch resume context continuity
        shell: python
        run: |
          from pathlib import Path
          p = Path('canva_apprentice/app/src/main/java/com/emrah/canvaapprentice/AgentAccessibilityService.java')
          s = p.read_text()

          old = '''        }else if(restored.mode==TaskState.Mode.RUNNING){
            final long generation=resumeGeneration.begin();
            new Handler(Looper.getMainLooper()).postDelayed(() -> resumeOnCanva(generation,0),500);
        }
'''
          new = '''        }else if(restored.mode==TaskState.Mode.RUNNING){
            final long generation=resumeGeneration.begin();
            final String resumeSessionId=repo.currentTeacherSessionId();
            final String resumeDesignAnchor=restored.designAnchor;
            new Handler(Looper.getMainLooper()).postDelayed(
                    () -> resumeOnCanva(generation,resumeSessionId,resumeDesignAnchor,0),500);
        }
'''
          if old not in s: raise SystemExit('restore resume snippet not found')
          s = s.replace(old,new,1)

          old = '''    private void showHumanOverlay(String reason){
        overlay.show(reason,()->{
            final long generation=resumeGeneration.begin();
            TeacherExecutionLease.invalidateGlobal();
            visualEvidence.clear();
            repo.resume();
            cycleBusy.set(false);
            consecutiveNoVisualChange=0;
            consecutiveExecutionFailures=0;
            resumeOnCanva(generation,0);
        });
    }
'''
          new = '''    private void showHumanOverlay(String reason){
        overlay.show(reason,()->{
            TeacherExecutionLease.invalidateGlobal();
            visualEvidence.clear();
            repo.resume();
            TaskState resumed=repo.load();
            if(resumed.mode!=TaskState.Mode.RUNNING){
                resumeGeneration.invalidate();
                return;
            }
            final long generation=resumeGeneration.begin();
            final String resumeSessionId=repo.currentTeacherSessionId();
            final String resumeDesignAnchor=resumed.designAnchor;
            cycleBusy.set(false);
            consecutiveNoVisualChange=0;
            consecutiveExecutionFailures=0;
            resumeOnCanva(generation,resumeSessionId,resumeDesignAnchor,0);
        });
    }
'''
          if old not in s: raise SystemExit('human resume snippet not found')
          s = s.replace(old,new,1)

          old = '''    private void resumeOnCanva(long generation, int attempt){
        if(!resumeGeneration.isCurrent(generation)) return;
        TaskState state=repo.load();
        if(state.mode!=TaskState.Mode.RUNNING){
            resumeGeneration.invalidate();
            return;
        }

        AccessibilityNodeInfo root=getRootInActiveWindow();
'''
          new = '''    private boolean isResumeContextCurrent(long generation, String expectedSessionId, String expectedDesignAnchor){
        if(!resumeGeneration.isCurrent(generation) || repo==null) return false;
        TaskState current=repo.load();
        return ResumeContextPolicy.isCurrent(
                current.mode,
                current.designAnchor,
                repo.currentTeacherSessionId(),
                expectedDesignAnchor,
                expectedSessionId
        );
    }

    private void resumeOnCanva(long generation, String expectedSessionId, String expectedDesignAnchor, int attempt){
        if(!isResumeContextCurrent(generation,expectedSessionId,expectedDesignAnchor)) return;
        TaskState state=repo.load();

        AccessibilityNodeInfo root=getRootInActiveWindow();
'''
          if old not in s: raise SystemExit('resume method header snippet not found')
          s = s.replace(old,new,1)

          old = '''        if(AgentConstants.CANVA_PACKAGE.equals(pkg)){
            resumeGeneration.consumeIfCurrent(generation,()->{
                if(repo.load().mode!=TaskState.Mode.RUNNING) return;
                cycleBusy.set(false);
                runCanvaCycle("Kullanıcı müdahalesi tamamlandı. Önce mevcut durumu yeniden doğrula ve kaldığın görevden devam et.");
            });
            return;
        }
'''
          new = '''        if(AgentConstants.CANVA_PACKAGE.equals(pkg)){
            if(!isResumeContextCurrent(generation,expectedSessionId,expectedDesignAnchor)) return;
            resumeGeneration.consumeIfCurrent(generation,()->{
                TaskState current=repo.load();
                if(!ResumeContextPolicy.isCurrent(
                        current.mode,current.designAnchor,repo.currentTeacherSessionId(),
                        expectedDesignAnchor,expectedSessionId)) return;
                cycleBusy.set(false);
                runCanvaCycle("Kullanıcı müdahalesi tamamlandı. Önce mevcut durumu yeniden doğrula ve kaldığın görevden devam et.");
            });
            return;
        }
'''
          if old not in s: raise SystemExit('resume success snippet not found')
          s = s.replace(old,new,1)

          old = '''        if(attempt>=12){
            resumeGeneration.consumeIfCurrent(generation,()->{
                if(repo.load().mode!=TaskState.Mode.RUNNING) return;
                pauseForHuman("Canva'ya güvenli biçimde dönülemedi. Canva'yı açıp DEVAM ET'e tekrar bas.");
            });
            return;
        }
'''
          new = '''        if(attempt>=12){
            if(!isResumeContextCurrent(generation,expectedSessionId,expectedDesignAnchor)) return;
            resumeGeneration.consumeIfCurrent(generation,()->{
                TaskState current=repo.load();
                if(!ResumeContextPolicy.isCurrent(
                        current.mode,current.designAnchor,repo.currentTeacherSessionId(),
                        expectedDesignAnchor,expectedSessionId)) return;
                pauseForHuman("Canva'ya güvenli biçimde dönülemedi. Canva'yı açıp DEVAM ET'e tekrar bas.");
            });
            return;
        }
'''
          if old not in s: raise SystemExit('resume timeout snippet not found')
          s = s.replace(old,new,1)

          old = '''        if(!resumeGeneration.isCurrent(generation)) return;
        new Handler(Looper.getMainLooper()).postDelayed(() -> resumeOnCanva(generation,attempt+1),300);
'''
          new = '''        if(!isResumeContextCurrent(generation,expectedSessionId,expectedDesignAnchor)) return;
        new Handler(Looper.getMainLooper()).postDelayed(
                () -> resumeOnCanva(generation,expectedSessionId,expectedDesignAnchor,attempt+1),300);
'''
          if old not in s: raise SystemExit('resume retry snippet not found')
          s = s.replace(old,new,1)
          p.write_text(s)

          Path('canva_apprentice/app/src/main/java/com/emrah/canvaapprentice/ResumeContextPolicy.java').write_text('''package com.emrah.canvaapprentice;\n\n/** Fail-closed ownership check for a DEVAM ET/service-restore resume chain. */\nfinal class ResumeContextPolicy {\n    private ResumeContextPolicy() {}\n\n    static boolean isCurrent(TaskState.Mode mode, String currentAnchor, String currentSessionId,\n                             String expectedAnchor, String expectedSessionId) {\n        if (mode != TaskState.Mode.RUNNING) return false;\n        String currentSession = currentSessionId == null ? "" : currentSessionId.trim();\n        String expectedSession = expectedSessionId == null ? "" : expectedSessionId.trim();\n        if (expectedSession.isEmpty() || !expectedSession.equals(currentSession)) return false;\n        String current = currentAnchor == null ? "" : currentAnchor.trim();\n        String expected = expectedAnchor == null ? "" : expectedAnchor.trim();\n        return expected.equals(current);\n    }\n}\n''')

          Path('canva_apprentice/app/src/test/java/com/emrah/canvaapprentice/ResumeContextPolicyTest.java').write_text('''package com.emrah.canvaapprentice;\n\nimport org.junit.Test;\nimport static org.junit.Assert.*;\n\npublic class ResumeContextPolicyTest {\n    @Test public void acceptsOnlySameRunningSessionAndDesignAnchor() {\n        assertTrue(ResumeContextPolicy.isCurrent(TaskState.Mode.RUNNING, "Design A", "session-2", "Design A", "session-2"));\n        assertTrue(ResumeContextPolicy.isCurrent(TaskState.Mode.RUNNING, "", "session-2", "", "session-2"));\n    }\n\n    @Test public void rejectsSessionRotationEvenWhenModeReturnsToRunning() {\n        assertFalse(ResumeContextPolicy.isCurrent(TaskState.Mode.RUNNING, "Design A", "session-3", "Design A", "session-2"));\n        assertFalse(ResumeContextPolicy.isCurrent(TaskState.Mode.RUNNING, "Design A", "", "Design A", "session-2"));\n        assertFalse(ResumeContextPolicy.isCurrent(TaskState.Mode.RUNNING, "Design A", "session-2", "Design A", ""));\n    }\n\n    @Test public void rejectsDesignAnchorRotationWithinSameSession() {\n        assertFalse(ResumeContextPolicy.isCurrent(TaskState.Mode.RUNNING, "Design B", "session-2", "Design A", "session-2"));\n        assertFalse(ResumeContextPolicy.isCurrent(TaskState.Mode.RUNNING, "Design A", "session-2", "", "session-2"));\n    }\n\n    @Test public void rejectsNonRunningModes() {\n        assertFalse(ResumeContextPolicy.isCurrent(TaskState.Mode.HUMAN_TAKEOVER, "Design A", "session-2", "Design A", "session-2"));\n        assertFalse(ResumeContextPolicy.isCurrent(TaskState.Mode.STOPPED, "Design A", "session-2", "Design A", "session-2"));\n        assertFalse(ResumeContextPolicy.isCurrent(TaskState.Mode.IDLE, "Design A", "session-2", "Design A", "session-2"));\n    }\n}\n''')
      - name: Remove one-shot patch workflow before commit
        run: rm .github/workflows/resume-context-continuity-patch.yml
      - name: Commit patched source locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add canva_apprentice/app/src/main/java/com/emrah/canvaapprentice/AgentAccessibilityService.java \
                  canva_apprentice/app/src/main/java/com/emrah/canvaapprentice/ResumeContextPolicy.java \
                  canva_apprentice/app/src/test/java/com/emrah/canvaapprentice/ResumeContextPolicyTest.java \
                  .github/workflows/resume-context-continuity-patch.yml
          git commit -m 'Harden resume session and design continuity'
      - name: Validate exact committed tree
        working-directory: canva_apprentice
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Push validated commit
        run: git push origin HEAD:canva-apprentice-agent
