name: LTX Remote Dependency Contract

on:
  push:
    branches: [video-fabrikasi-android]
  workflow_dispatch:

jobs:
  remote-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "transformers==4.49.0" "sentencepiece==0.2.0" "huggingface-hub==0.30.2" "safetensors==0.5.3" "pillow<12"
      - name: Verify PixArt tokenizer and SigLIP processor contracts
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download, HfApi
          from transformers import T5Tokenizer, AutoProcessor

          repo = "PixArt-alpha/PixArt-XL-2-1024-MS"
          vocab = hf_hub_download(repo_id=repo, filename="tokenizer/spiece.model")
          assert vocab and os.path.isfile(vocab), vocab
          print("VOCAB_DIRECT", vocab, os.path.getsize(vocab))

          tok = T5Tokenizer.from_pretrained(repo, subfolder="tokenizer")
          assert tok.vocab_file and os.path.isfile(tok.vocab_file), tok.vocab_file
          print("TOKENIZER_OK", tok.vocab_file, len(tok))

          proc = AutoProcessor.from_pretrained(
              "google/siglip-base-patch16-224",
              revision="8d307961cfc45a1bbceecac290bec0a07e9a48db",
          )
          print("SIGLIP_PROCESSOR_OK", type(proc).__name__)

          info = HfApi().model_info("Lightricks/LTX-Video", files_metadata=True)
          target = "ltxv-2b-0.9.6-distilled-04-25.safetensors"
          matches = [s for s in info.siblings if s.rfilename == target]
          assert len(matches) == 1, target
          print("LTX_CHECKPOINT_PRESENT", target, matches[0].size)
          PY
