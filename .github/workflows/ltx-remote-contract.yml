name: LTX Remote Dependency Contract

on:
  push:
    branches: [video-fabrikasi-android]
  workflow_dispatch:

jobs:
  remote-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "transformers==4.49.0" "sentencepiece==0.2.0" "huggingface-hub==0.30.2" "safetensors==0.5.3" "protobuf==5.29.5" "pillow<12"
      - name: Verify PixArt tokenizer and SigLIP processor contracts
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download, HfApi
          from transformers import T5Tokenizer, AutoProcessor, MarianTokenizer, AutoConfig

          repo = "PixArt-alpha/PixArt-XL-2-1024-MS"
          vocab = hf_hub_download(repo_id=repo, filename="tokenizer/spiece.model")
          assert vocab and os.path.isfile(vocab), vocab
          print("VOCAB_DIRECT", vocab, os.path.getsize(vocab))

          tok = T5Tokenizer.from_pretrained(repo, subfolder="tokenizer")
          assert tok.vocab_file and os.path.isfile(tok.vocab_file), tok.vocab_file
          print("TOKENIZER_OK", tok.vocab_file, len(tok))

          tr_model = "Helsinki-NLP/opus-mt-tr-en"
          tr_revision = "19c65427cc2af5f191337d4899e0348c4af25902"
          src = hf_hub_download(repo_id=tr_model, filename="source.spm", revision=tr_revision)
          tgt = hf_hub_download(repo_id=tr_model, filename="target.spm", revision=tr_revision)
          voc = hf_hub_download(repo_id=tr_model, filename="vocab.json", revision=tr_revision)
          for p in (src, tgt, voc):
              assert p and os.path.isfile(p), p
          tr_tok = MarianTokenizer(source_spm=src, target_spm=tgt, vocab=voc, model_max_length=512)
          sample = tr_tok("İki beyaz mektup aynı kişiye gidiyor.", return_tensors=None)
          assert sample.get("input_ids"), sample
          print("TRANSLATION_TOKENIZER_OK", type(tr_tok).__name__, len(tr_tok))
          tr_cfg = AutoConfig.from_pretrained(tr_model, revision=tr_revision)
          assert tr_cfg.model_type == "marian", tr_cfg.model_type
          print("TRANSLATION_CONFIG_OK", tr_cfg.model_type)

          proc = AutoProcessor.from_pretrained(
              "google/siglip-base-patch16-224",
              revision="8d307961cfc45a1bbceecac290bec0a07e9a48db",
          )
          print("SIGLIP_PROCESSOR_OK", type(proc).__name__)

          info = HfApi().model_info("Lightricks/LTX-Video", files_metadata=True)
          target = "ltxv-2b-0.9.6-distilled-04-25.safetensors"
          matches = [s for s in info.siblings if s.rfilename == target]
          assert len(matches) == 1, target
          print("LTX_CHECKPOINT_PRESENT", target, matches[0].size)
          PY
